<!DOCTYPE html>
<html lang="tl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Impact App</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4b3fd1"><link rel="apple-touch-icon" href="icon-192.png"><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f3f1fa;--card:#fff;--ink:#1c1a2e;--mut:#6b6885;--acc:#4b3fd1;--gold:#c8912a;--line:#dcd8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132a;--card:#1f1c3a;--ink:#ece9ff;--mut:#9d99c4;--acc:#8f86ff;--gold:#e6b04d;--line:#33305a}}
:root[data-theme="dark"]{--bg:#15132a;--card:#1f1c3a;--ink:#ece9ff;--mut:#9d99c4;--acc:#8f86ff;--gold:#e6b04d;--line:#33305a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
header{padding:28px 18px 8px;max-width:820px;margin:auto}
h1{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:800;letter-spacing:-.03em}
h1 b{color:var(--gold);font-weight:800}
header p{margin:6px 0 0;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 18px;max-width:820px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer}
nav button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:820px;margin:auto;padding:6px 18px 60px}
section{margin-top:18px}
h2{font-size:1.5rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card small,.mut{color:var(--mut)}
.card h3{font-size:1.1rem;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
img.pic{width:100%;border-radius:10px;display:block}
.banner{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.banner img{flex:none;width:100%;max-height:260px;object-fit:cover;border-radius:14px;scroll-snap-align:start}
.btn{border:0;background:var(--acc);color:#fff;padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer;font-size:.9rem}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;float:right;font-size:1.1rem}
.badge{display:inline-block;background:var(--gold);color:#1c1a2e;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:600}
.role{font-size:.85rem;color:var(--mut);margin-top:4px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,440px);padding:18px}
dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.empty{color:var(--mut);padding:14px;border:1px dashed var(--line);border-radius:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pre{white-space:pre-wrap}
body:not(.in) header,body:not(.in) nav,body:not(.in) main{display:none}
#gate{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
body:not(.in) #gate{display:flex}
#gate img{width:150px;height:150px;border-radius:50%;margin-bottom:14px}
#gate h1{font-size:2.2rem}
#gate form{width:min(92vw,360px);text-align:left;margin-top:14px}
body.chk #gform{display:none}
#gform .btn{flex:1;padding:12px}
#gmsg{margin-top:12px;color:var(--mut);min-height:1.4em}
</style></head><body class="chk">
<div id="gate"><img src="icon-512.png" alt="Division 4 Blue Impact"><h1>Blue Impact</h1><p class="mut">Division 4 · Mag-login para makapasok</p>
<form id="gform"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="pw" type="password" minlength="6" autocomplete="current-password" required></label>
<div class="row" style="justify-content:stretch"><button class="btn ghost" value="up">Sign up</button><button class="btn" value="in">Login</button></div></form>
<div id="gmsg">Sandali lang…</div></div>
<header><h1>D4<b>.</b>Division</h1><p><span id="who">Nagloload…</span> <button class="btn ghost" id="auth">Login</button></p></header>
<nav id="nav"></nav>
<main id="app"></main>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://ctoerqoxnvrmkzzcfusi.supabase.co",SB_KEY="PASTE_SUPABASE_ANON_KEY";
const TABS=[["home","Home"],["events","Events"],["members","Members"],["rules","Rules"],["ach","Achievements"],["points","Update Points"],["comics","Comics"],["roles","Roles"]];
const P={event:["Rida","Shinigami"],banner:["Rida","Hisho"],remind:["Rida","Chui"],member:["Rida","Jinji"],points:["Rida","Enjo"],admin:["Rida"]};
const ROLES=["Rida","Hisho","Chui","Shinigami","Jinji","Enjo"];
let items=[],roles={},profs=[],me=null,tab="home";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okImg=s=>typeof s==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(s);
const myRole=()=>(me&&roles[me])||null;
const can=p=>{const r=myRole();return !!r&&P[p].includes(r)};
const by=k=>items.filter(i=>i.k===k);
const latest=k=>by(k).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
const wr=async fn=>{try{const r=await fn();if(r&&r.error)throw r.error;await load()}catch(e){toast("Hindi na-save: "+(e.message||"error"))}};
function toast(m){alert(m)}
const add=o=>{const {k,ts,by,...rest}=o;return wr(()=>sb.from("items").insert({k,data:rest}))};
const del=id=>confirm("Burahin ito?")&&wr(()=>sb.from("items").delete().eq("id",id));
const addBtn=(p,label,kind)=>can(p)?`<button class="btn" data-form="${kind}">${label}</button>`:"";
const delBtn=(p,id)=>can(p)?`<button class="x" data-del="${id}" aria-label="Burahin">×</button>`:"";

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=900,q=.65,out;for(let i=0;i<4;i++){const s=Math.min(1,w/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<230000)return res(out);w-=200;q-=.08}rej(new Error("Masyadong malaki ang image"))};im.src=r.result};r.readAsDataURL(file)})}

const FORMS={
 event:{t:"Bagong event",f:[["title","Pangalan"],["date","Petsa","date"],["time","Oras","time"],["desc","Detalye","area"]],p:"event"},
 qotd:{t:"Update QOTD",f:[["text","Question of the day","area"]],p:"remind",k:"qotd"},
 spm:{t:"Update SPM reminder",f:[["text","Reminder","area"]],p:"remind",k:"spm"},
 banner:{t:"Bagong banner",f:[["img","Image","img"]],p:"banner"},
 member:{t:"Magdagdag ng member",f:[["name","Pangalan"],["rank","Rank / role"],["officer","Officer ba?","officer"]],p:"member"},
 points:{t:"Update points image",f:[["img","Image","img"],["caption","Caption"]],p:"points"},
 ach:{t:"Bagong achievement",f:[["type","Uri","type"],["season","Season"],["title","Contest / award"],["name","Winner"]],p:"admin"},
 comic:{t:"Mag-submit ng comic page",f:[["title","Title ng comic"],["author","Author"],["chapter","Chapter"],["img","Page (image)","img"]],p:"any"}
};
function field([n,l,t]){
 if(t==="area")return `<label>${l}<textarea name="${n}" rows="4" required></textarea></label>`;
 if(t==="img")return `<label>${l}<input type="file" name="${n}" accept="image/*" required></label>`;
 if(t==="officer")return `<label>${l}<select name="${n}"><option value="">Member</option><option value="1">Officer</option></select></label>`;
 if(t==="type")return `<label>${l}<select name="${n}"><option value="contest">Contest winner</option><option value="officer">Best officer</option></select></label>`;
 return `<label>${l}<input name="${n}" type="${t||"text"}" required></label>`;
}
function openForm(name){
 const F=FORMS[name];if(!F)return;
 $("#frm").innerHTML=`<h2>${F.t}</h2>${F.f.map(field).join("")}<div class="row"><button class="btn ghost" value="x" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>`;
 $("#frm").onsubmit=async e=>{
  if(e.submitter?.value!=="ok")return;
  e.preventDefault();const fd=new FormData($("#frm")),o={k:F.k||name};
  try{for(const [n,,t] of F.f){if(t==="img"){o[n]=await shrink(fd.get(n))}else o[n]=fd.get(n)}}catch(err){return toast(err.message||"Di mabasa ang image")}
  if(name==="comic")o.status=can("admin")?"ok":"pending";
  if(name==="member")o.officer=!!o.officer;
  await add(o);$("#dlg").close();
 };
 $("#dlg").showModal();
}

const V={
home(){
 const b=by("banner").sort((a,c)=>c.ts-a.ts).filter(i=>okImg(i.img)),q=latest("qotd"),s=latest("spm"),today=new Date().toISOString().slice(0,10);
 const ev=by("event").filter(e=>e.date>=today).sort((a,c)=>(a.date+a.time).localeCompare(c.date+c.time)).slice(0,3);
 return `<section>${b.length?`<div class="banner">${b.map(i=>`<img src="${i.img}" alt="Banner">`).join("")}</div>`:`<div class="empty">Wala pang banner.</div>`}
 <div style="margin-top:8px">${addBtn("banner","+ Banner","banner")} ${b.length&&can("banner")?`<button class="btn ghost" data-del="${esc(by("banner").sort((a,c)=>c.ts-a.ts)[0].id)}">Burahin ang pinakabago</button>`:""}</div></section>
 <section><h2>QOTD ${addBtn("remind","Update","qotd")}</h2><div class="card pre">${q?esc(q.text):"<span class=mut>Wala pang QOTD.</span>"}</div></section>
 <section><h2>SPM reminder ${addBtn("remind","Update","spm")}</h2><div class="card pre">${s?esc(s.text):"<span class=mut>Wala pang reminder.</span>"}</div></section>
 <section><h2>Susunod na events</h2>${ev.length?ev.map(evCard).join(""):`<div class="empty">Walang upcoming event.</div>`}</section>`},
events(){
 const today=new Date().toISOString().slice(0,10),all=by("event").sort((a,c)=>(a.date+a.time).localeCompare(c.date+c.time));
 const up=all.filter(e=>e.date>=today),past=all.filter(e=>e.date<today).reverse();
 return `<section><h2>Upcoming ${addBtn("event","+ Event","event")}</h2>${up.length?up.map(evCard).join(""):`<div class="empty">Walang upcoming event.</div>`}</section>
 <section><h2>Past events</h2>${past.length?past.map(evCard).join(""):`<div class="empty">Wala pa.</div>`}</section>`},
members(){
 const m=by("member").sort((a,c)=>a.name.localeCompare(c.name)),of=m.filter(x=>x.officer),rest=m.filter(x=>!x.officer);
 const c=x=>`<div class="card">${delBtn("member",x.id)}<h3>${esc(x.name)}</h3><small>${esc(x.rank)}</small></div>`;
 return `<section><h2>Officers ${addBtn("member","+ Member","member")}</h2>${of.length?of.map(c).join(""):`<div class="empty">Wala pang officer.</div>`}</section>
 <section><h2>Members (${rest.length})</h2>${rest.length?rest.map(c).join(""):`<div class="empty">Wala pang member.</div>`}</section>`},
rules(){
 const r=items.find(i=>i.id==="rules");
 return `<section><h2>Division rules ${can("admin")?`<button class="btn" data-rules="1">I-edit</button>`:""}</h2><div class="card pre">${r?esc(r.text):"<span class=mut>Wala pang rules.</span>"}</div></section>`},
ach(){
 const a=by("ach").sort((x,y)=>String(y.season).localeCompare(String(x.season),undefined,{numeric:true}));
 const sec=(t,ty)=>{const l=a.filter(x=>x.type===ty);return `<section><h2>${t}</h2>${l.length?l.map(x=>`<div class="card">${delBtn("admin",x.id)}<span class="badge">Season ${esc(x.season)}</span><h3 style="margin-top:6px">${esc(x.name)}</h3><small>${esc(x.title)}</small></div>`).join(""):`<div class="empty">Wala pa.</div>`}</section>`};
 return `<div style="margin-top:14px">${addBtn("admin","+ Achievement","ach")}</div>${sec("Contest winners (D4)","contest")}${sec("Best officers kada season","officer")}`},
points(){
 const p=by("points").filter(i=>okImg(i.img)).sort((a,c)=>c.ts-a.ts);
 return `<section><h2>Division update points ${addBtn("points","+ Image","points")}</h2>${p.length?p.map(x=>`<div class="card">${delBtn("points",x.id)}<img class="pic" src="${x.img}" alt="Update points"><small>${esc(x.caption)}</small></div>`).join(""):`<div class="empty">Wala pang update.</div>`}</section>`},
comics(){
 const ok=by("comic").filter(i=>i.status==="ok"&&okImg(i.img)),pend=by("comic").filter(i=>i.status==="pending");
 const g={};ok.forEach(x=>(g[x.title]=g[x.title]||[]).push(x));
 const html=Object.keys(g).map(t=>{const l=g[t].sort((a,c)=>String(a.chapter).localeCompare(String(c.chapter),undefined,{numeric:true})||a.ts-c.ts);return `<div class="card"><h3>${esc(t)}</h3><small>ni ${esc(l[0].author)}</small><div class="grid" style="margin-top:10px">${l.map(x=>`<div>${delBtn("admin",x.id)}<img class="pic" src="${x.img}" alt="${esc(t)}"><small>Ch. ${esc(x.chapter)}</small></div>`).join("")}</div></div>`}).join("");
 return `<section><h2>D4 Comics <button class="btn" data-form="comic"${me?"":" disabled"}>+ Mag-submit</button></h2><p class="mut">Optional lang. Dadaan muna kay Rida bago lumabas.</p>${html||`<div class="empty">Wala pang comic.</div>`}</section>
 ${can("admin")&&pend.length?`<section><h2>Naghihintay ng approval</h2>${pend.map(x=>`<div class="card"><h3>${esc(x.title)} · Ch. ${esc(x.chapter)}</h3><small>ni ${esc(x.author)}</small>${okImg(x.img)?`<img class="pic" src="${x.img}" alt="">`:""}<div class="row"><button class="btn ghost" data-del="${x.id}">Reject</button><button class="btn" data-ok="${x.id}">Approve</button></div></div>`).join("")}</section>`:""}`},
roles(){
 if(!can("admin"))return `<div class="empty">Si Rida lang ang pwedeng mag-manage ng roles.</div>`;
 return `<section><h2>Roles</h2><p class="mut">Lalabas dito ang lahat ng nag-sign up.</p>${profs.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="row" style="justify-content:flex-start"><select data-setrole="${esc(p.id)}"><option value="">Walang role</option>${ROLES.map(r=>`<option${p.role===r?" selected":""}>${r}</option>`).join("")}</select></div></div>`).join("")||`<div class="empty">Wala pang account.</div>`}</section>`}
};
function evCard(e){return `<div class="card">${delBtn("event",e.id)}<h3>${esc(e.title)}</h3><small>${esc(e.date)} ${esc(e.time||"")}</small><div class="pre">${esc(e.desc)}</div></div>`}

function render(){
 $("#nav").innerHTML=TABS.filter(t=>t[0]!=="roles"||can("admin")).map(([k,l])=>`<button data-tab="${k}" aria-current="${k===tab}">${l}</button>`).join("");
 $("#app").innerHTML=(V[tab]||V.home)();
 const r=myRole();$("#who").textContent=r?`Naka-login ka bilang ${r}`:(me?"Member view · walang upload role":"Read-only view");
 $("#auth").textContent=me?"Logout":"Login";
}
const sb=supabase.createClient(SB_URL,SB_KEY);
async function load(){
 const [a,b]=await Promise.all([sb.from("items").select("*"),sb.from("profiles").select("*")]);
 if(a.error){$("#who").textContent="Hindi ma-load ang data: "+a.error.message;return}
 items=a.data.map(r=>({...r.data,k:r.k,id:r.id,ts:Date.parse(r.created_at),by:r.author}));
 profs=b.data||[];roles={};profs.forEach(p=>{if(p.role)roles[p.id]=p.role});render();
}
function authForm(){
 $("#frm").innerHTML=`<h2>Login</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="pw" type="password" minlength="6" required></label><div class="row"><button class="btn ghost" value="x" formnovalidate>Cancel</button><button class="btn ghost" value="up">Sign up</button><button class="btn" value="in">Login</button></div>`;
 $("#frm").onsubmit=async e=>{const v=e.submitter?.value;if(v==="x")return;e.preventDefault();const fd=new FormData($("#frm")),c={email:fd.get("email"),password:fd.get("pw")};
  const r=v==="up"?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error)return toast(r.error.message);if(v==="up"&&!r.data.session)toast("I-check ang email mo para i-confirm ang account.");$("#dlg").close()};
 $("#dlg").showModal();
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(t.id==="auth")return me?sb.auth.signOut():authForm();
 if(d.tab){tab=d.tab;render();return}
 if(d.form)return openForm(d.form);
 if(d.del)return del(d.del);
 if(d.ok){const it=items.find(i=>i.id===d.ok),{k,id,ts,by,...rest}=it;return wr(()=>sb.from("items").update({data:{...rest,status:"ok"}}).eq("id",d.ok))}
 if(d.rules){const r=items.find(i=>i.id==="rules");$("#frm").innerHTML=`<h2>Division rules</h2><label>Rules<textarea name="text" rows="10" required>${esc(r?.text||"")}</textarea></label><div class="row"><button class="btn ghost" value="x" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>`;$("#frm").onsubmit=async ev=>{if(ev.submitter?.value!=="ok")return;ev.preventDefault();await wr(()=>sb.from("items").upsert({id:"rules",k:"rules",data:{text:new FormData($("#frm")).get("text")}}));$("#dlg").close()};$("#dlg").showModal()}
});
document.addEventListener("change",e=>{const x=e.target.closest("[data-setrole]");if(x)wr(()=>sb.from("profiles").update({role:x.value||null}).eq("id",x.dataset.setrole))});
const gm=t=>{$("#gmsg").textContent=t||""};
const tl=m=>/invalid login/i.test(m)?"Mali ang email o password, o wala ka pang account. Pindutin ang Sign up kung bago ka.":/already registered/i.test(m)?"May account na ang email na ito. Pindutin ang Login.":m;
$("#gform").onsubmit=async e=>{e.preventDefault();const v=e.submitter?.value,fd=new FormData($("#gform")),c={email:fd.get("email"),password:fd.get("pw")};gm("Sandali lang…");
 const r=v==="up"?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
 if(r.error)return gm(tl(r.error.message));
 if(v==="up"&&!r.data.session)gm("I-check ang email mo para i-confirm ang account.")};
render();
if(SB_URL.includes("PASTE")||SB_KEY.includes("PASTE")){document.body.classList.remove("chk");gm("Ilagay muna ang Supabase key sa index.html")}
else{sb.auth.onAuthStateChange((_,ses)=>{me=ses?.user?.id||null;document.body.classList.remove("chk");document.body.classList.toggle("in",!!me);gm("");if(me)load();else{items=[];profs=[];roles={};render()}});setInterval(()=>{if(me)load()},30000)}
</script></body></html>
